<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titel -->
    <title>Om Mig</title>

    <!-- CSS för Layout -->
    <link rel="stylesheet" href="/src/styles/style.css">
    
    <!-- Ikoner -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <!-- Script för hela sidan -->
    <script type="module" src="/src/js/script.js" defer></script>

    <script type="module" src="/src/js/modules/header.js" defer></script>
</head>

    <!-- Headern returneras i header.js -->
    <header id="header">
      </header>
    <!-- Main -->
    <main>

        <article class="banner">
            <!-- Container för introduktion -->
            <section class="introduction-container">

                <span class="introduction">

                </span>
                <!-- Container för filtrering -->
                 <section class="skills-container">
                    <h3>Filter Skills</h3>

                    <section class="skills"></section>
            </section>
        </article>

         <article id="projects"></article>  
        
    </main>
